name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'vendor/**'
      - 'functions/**'
      - 'wrangler.toml'
      - 'tools/build-cloudflare.js'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build deploy-ready folder
        run: node tools/build-cloudflare.js

      - name: Deploy to Cloudflare Pages
        run: |
          npx -y wrangler@3 pages project create moneyfast --production-branch=main || true
          npx -y wrangler@3 pages deploy dist/cloudflare --project-name=moneyfast
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
