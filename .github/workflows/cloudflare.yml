name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'vendor/**'
      - 'tools/build-cloudflare.js'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build deploy-ready folder
        run: node tools/build-cloudflare.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages project create moneyfast --production-branch=main --commit-dirty=true || true
            pages deploy dist/cloudflare --project-name=moneyfast --commit-dirty=true
