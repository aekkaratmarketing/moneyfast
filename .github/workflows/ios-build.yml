name: Build iOS .ipa

on:
  push:
    paths:
      - 'admin.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync web assets + install Capacitor
        working-directory: ios
        run: |
          node sync-www.js
          npm install

      - name: Add + sync iOS platform
        working-directory: ios
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build .ipa (unsigned)
        working-directory: ios/ios
        run: |
          # หา Xcode workspace/project อัตโนมัติ (โครงสร้าง Capacitor ใหม่ อยู่ในโฟลเดอร์ App/)
          WS=$(find . -name "*.xcworkspace" -not -path "*/build/*" -not -path "*.xcodeproj/*" | head -1)
          PROJ=$(find . -name "*.xcodeproj" -not -path "*/build/*" | head -1)
          if [ -n "$WS" ]; then
            TARGET="-workspace $(basename "$WS")"
            BUILD_DIR=$(dirname "$WS")
            SCHEME=$(basename "$WS" .xcworkspace)
          else
            TARGET="-project $(basename "$PROJ")"
            BUILD_DIR=$(dirname "$PROJ")
            SCHEME=$(basename "$PROJ" .xcodeproj)
          fi
          echo "▶ Target: $TARGET / Scheme: $SCHEME (ใน $BUILD_DIR)"
          cd "$BUILD_DIR"
          xcodebuild $TARGET -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP="build/Build/Products/Release-iphoneos/$SCHEME.app"
          rm -rf Payload && mkdir -p Payload && cp -r "$APP" Payload/
          rm -f MoneyFast.ipa
          zip -qr MoneyFast.ipa Payload/
          mv MoneyFast.ipa "$GITHUB_WORKSPACE/ios/ios/MoneyFast.ipa"
          ls -lh "$GITHUB_WORKSPACE/ios/ios/MoneyFast.ipa"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFast-ipa
          path: ios/ios/MoneyFast.ipa
          if-no-files-found: error
